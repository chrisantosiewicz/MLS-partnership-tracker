# Daily pipeline: fetch new data, rebuild the warehouse, run the data tests,
# render the site and publish it to GitHub Pages.
#
# If any step fails (for example a data test returns rows), later steps are
# skipped: no data is committed and yesterday's site stays up. The next run
# picks up where the last successful one stopped, because ingestion is
# incremental from the data committed in data/raw/.

name: Daily build

on:
  schedule:
    - cron: "17 9 * * *"     # 09:17 UTC daily, after Wikimedia publishes yesterday's views
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["data/*.csv", "sql/**", "tests/**", "python/**", "site/**", "requirements.txt"]

permissions:
  contents: write   # commit refreshed data/raw files
  pages: write      # publish the site
  id-token: write   # required by deploy-pages

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Fetch Wikipedia pageviews (incremental)
        run: python python/wiki_pageviews.py

      - name: Fetch MLS matches from American Soccer Analysis
        run: python python/asa_matches.py

      - name: Build warehouse and run data tests
        run: python python/build.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render site

      - name: Commit refreshed raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

      - id: deploy
        uses: actions/deploy-pages@v4
